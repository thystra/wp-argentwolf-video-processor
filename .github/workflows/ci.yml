# File: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ARGENT_VIDEO_CI_FFMPEG_VERSION: '8.1.2'
      ARGENT_VIDEO_CI_FFMPEG_PREFIX: /tmp/argentwolf-ci-ffmpeg-8.1.2
      ARGENT_VIDEO_CI_FFMPEG_JOBS: '2'
      ARGENT_VIDEO_TEST_FFMPEG: /tmp/argentwolf-ci-ffmpeg-8.1.2/bin/ffmpeg
      ARGENT_VIDEO_TEST_FFPROBE: /tmp/argentwolf-ci-ffmpeg-8.1.2/bin/ffprobe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' argentwolf-video-processor.php | head -n1)"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gnupg \
            libopus-dev \
            libvpx-dev \
            libx264-dev \
            nasm \
            pkg-config \
            rsync \
            unzip \
            yasm \
            zip

      - name: Build verified security-patched FFmpeg
        run: bash build/install-ci-ffmpeg.sh "${ARGENT_VIDEO_CI_FFMPEG_VERSION}"

      - name: Verify Node, npm, and FFmpeg
        run: |
          node --version
          npm --version
          "${ARGENT_VIDEO_TEST_FFMPEG}" -version
          "${ARGENT_VIDEO_TEST_FFPROBE}" -version

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Run tests
        run: |
          php tests/model-persistence.php
          php tests/backend-local.php
          php tests/peertube-connection-foundation.php
          php tests/peertube-http-api.php
          bash -n tests/integration/peertube-http-smoke.sh
          php tests/run.php
          php tests/storage-boundary.php
          php -d open_basedir="${GITHUB_WORKSPACE}:/tmp" tests/open-basedir.php
          php tests/smoke-load.php
          php tests/ffmpeg-security.php
          ARGENT_VIDEO_EXPECT_SECURITY=allow php tests/ffmpeg-security-binary.php
          php tests/ffmpeg-integration.php
          bash tests/vendor-fetch.sh
          node --check assets/js/argent-video-player.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Build installable plugin ZIP
        run: bash build/build-plugin.sh '${{ steps.version.outputs.version }}'

      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/argentwolf-video-processor-${{ steps.version.outputs.version }}.zip"
          test "$(unzip -Z1 "${ZIP}" | awk -F/ 'NF {print $1}' | sort -u)" = 'argentwolf-video-processor'
          unzip -Z1 "${ZIP}" | grep -qx 'argentwolf-video-processor/argentwolf-video-processor.php'
          unzip -Z1 "${ZIP}" | grep -qx 'argentwolf-video-processor/assets/vendor/hls.min.js'
          unzip -Z1 "${ZIP}" | grep -qx 'argentwolf-video-processor/assets/vendor/hls.LICENSE'
          ! unzip -Z1 "${ZIP}" | grep -qx 'argentwolf-video-processor/assets/vendor/hls.VERSION'
          ! unzip -Z1 "${ZIP}" | grep -qx 'argentwolf-video-processor/assets/vendor/hls.SHA256'
          ! unzip -Z1 "${ZIP}" | grep -Eq '/(AGENTS|ARCHITECTURE|TODO|tests|build|ops|\.github)'
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: argentwolf-video-processor-${{ steps.version.outputs.version }}
          path: |
            dist/argentwolf-video-processor-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

# EOF: .github/workflows/ci.yml
