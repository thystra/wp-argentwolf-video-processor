# File: .github/workflows/ci.yml
name: CI

# Forgejo is authoritative for automatic CI. Keep the GitHub mirror workflow
# available for explicit diagnostics without running (and emailing failures) on
# every mirrored push or pull-request update.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: forgejo.argentwolf.org/alan/wp-argentwolf-video-processor/ci-ffmpeg@sha256:bd97a501289e54169996c6ab6860719b09e09b99994d15bd809ecd6c2dfca74b
    env:
      ARGENT_VIDEO_CI_FFMPEG_VERSION: '9.0.1'
      ARGENT_VIDEO_CI_FFMPEG_PREFIX: /opt/awvp-ffmpeg
      ARGENT_VIDEO_TEST_FFMPEG: /opt/awvp-ffmpeg/bin/ffmpeg
      ARGENT_VIDEO_TEST_FFPROBE: /opt/awvp-ffmpeg/bin/ffprobe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' argentwolf-video-processor.php | head -n1)"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: ${VERSION}" >&2
            exit 1
          fi
          bash build/validate-version.sh "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify CI toolchain image
        run: awvp-verify-ci-image

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './dist/*' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Run tests
        run: |
          bash tests/version-validator.sh
          bash tests/release-validation/test-build-bundle.sh
          bash tests/release-validation/test-runner-failure-collection.sh
          php tests/version-policy.php
          php tests/model-persistence.php
          php tests/uninstall-data.php
          php tests/backend-health-incident.php
          php tests/backend-maintenance-status.php
          php tests/backend-processing-estimator.php
          php tests/backend-serving-priority.php
          php tests/serving-viability.php
          php tests/remote-publication-health.php
          php tests/remote-publication-health-service.php
          php tests/peertube-publication-health.php
          php tests/remote-health-notification-policy.php
          php tests/remote-health-notification-state.php
          php tests/remote-health-notification-service.php
          php tests/remote-health-operator.php
          php tests/local-delivery-rebuild-service.php
          php tests/peertube-daily-maintenance.php
          php tests/multi-backend-serving-failover.php
          php tests/overview-disposition-store.php
          php tests/rc10-overview-resolution-health.php
          php tests/remote-republish-service.php
          php tests/local-retention-default-policy.php
          php tests/local-delivery-evidence.php
          php tests/peertube-event-repository.php
          php tests/publication-history-admin.php
          php tests/operator-event-language.php
          php tests/video-destination-publication-plan.php
          php tests/video-publishing-defaults.php
          php tests/video-publishing-admin-boundary.php
          php tests/operator-time.php
          php tests/settings-hub.php
          php tests/video-reference-index.php
          php tests/video-routing-admin.php
          php tests/peertube-publication-catalog.php
          php tests/peertube-publication-authority-repair.php
          php tests/peertube-publication-editor.php
          php tests/peertube-publication-editor-rest.php
          php tests/editorial-publish-validator.php
          php tests/editorial-publish-gate.php
          php tests/peertube-publication-lifecycle.php
          php tests/peertube-publication-synchronizer.php
          php tests/peertube-publication-manifest.php
          php tests/peertube-publication-execution.php
          php tests/peertube-publication-staging.php
          php tests/peertube-publication-thumbnail.php
          php tests/peertube-publication-task-coordinator.php
          php tests/peertube-publication-finalizer-recovery.php
          php tests/rc9-incomplete-work-lookback.php
          php tests/rc9-overview-status.php
          php tests/peertube-operator-terminology.php
          php tests/rc9-peertube-first-player-cleanup.php
          php tests/video-serving-authority.php
          php tests/video-serving-cutover.php
          php tests/local-retention-policy.php
          php tests/archive-of-record-policy.php
          php tests/wordpress-source-file.php
          php tests/local-retention-service.php
          php tests/local-retention-admin.php
          php tests/peertube-migration-plan.php
          php tests/peertube-migration-execution.php
          php tests/peertube-migration-planner.php
          php tests/legacy-video-adoption.php
          php tests/legacy-video-serving-bridge.php
          php tests/peertube-migration-executor.php
          php tests/peertube-migration-admin.php
          php tests/video-block-editor-service.php
          php tests/local-processing-routing.php
          php tests/video-block-editor-rest.php
          php tests/video-block.php
          php tests/renderer-player.php
          php tests/task-repository.php
          php tests/peertube-upload-task-coordinator.php
          php tests/peertube-upload-failure-notification.php
          php tests/peertube-task-worker.php
          php tests/peertube-task-worker-drain.php
          php tests/peertube-task-worker-launcher.php
          php tests/peertube-task-cron-wiring.php
          php tests/peertube-upload-policy.php
          php tests/peertube-upload-runtime-budget.php
          php tests/peertube-task-cli.php
          php tests/backend-local.php
          php tests/peertube-capability-activation.php
          php tests/peertube-connection-foundation.php
          php tests/peertube-http-api.php
          php tests/peertube-stream-upload-http.php
          php tests/atomic-option-cas.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/atomic-option-cas.php
          php tests/atomic-option-planning.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/atomic-option-planning.php
          php tests/backend-registry-atomic.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/backend-registry-atomic.php
          php tests/peertube-connection-state-machine.php
          php tests/peertube-connection-operation-store.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-connection-operation-store.php
          php tests/managed-secret-persistence.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/managed-secret-persistence.php
          php tests/peertube-connection-coordinator.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-connection-coordinator.php
          php tests/peertube-password-grant-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-password-grant-service.php
          php tests/peertube-identity-destination-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-identity-destination-service.php
          php tests/peertube-backend-activation-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-backend-activation-service.php
          php tests/peertube-token-lifecycle-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-token-lifecycle-service.php
          php tests/peertube-staged-source-identity.php
          php tests/peertube-upload-slice.php
          php tests/peertube-staged-upload-state-machine.php
          php tests/peertube-staged-upload-guard.php
          php tests/peertube-staged-upload-boundary.php
          php tests/peertube-staged-upload-operation-store.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-staged-upload-operation-store.php
          php tests/peertube-staged-upload-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-staged-upload-service.php
          php tests/peertube-remote-asset-repository.php
          php tests/peertube-remote-asset-reconciliation-service.php
          AWVP_ATOMIC_MODERN_AUTOLOAD=1 php tests/peertube-remote-asset-reconciliation-service.php
          php tests/peertube-remote-reconciliation-boundary.php
          php tests/peertube-connection-admin.php
          bash -n tests/integration/peertube-http-smoke.sh
          bash -n tests/integration/peertube-auth-api-smoke.sh
          bash -n tests/integration/peertube-persistence-smoke.sh
          bash -n tests/integration/peertube-connection-coordinator-smoke.sh
          bash -n tests/integration/peertube-password-grant-smoke.sh
          bash -n tests/integration/peertube-admin-authorization-smoke.sh
          bash -n tests/integration/peertube-identity-destination-smoke.sh
          bash -n tests/integration/peertube-backend-activation-smoke.sh
          bash -n tests/integration/peertube-token-lifecycle-smoke.sh
          bash -n tests/integration/peertube-staged-upload-smoke.sh
          bash -n tests/integration/peertube-remote-asset-reconciliation-smoke.sh
          bash -n tests/integration/peertube-task-cli-smoke.sh
          bash -n tests/integration/peertube-task-cli-drain-smoke.sh
          bash -n tests/integration/peertube-task-cli-indeterminate-smoke.sh
          bash -n tests/integration/peertube-task-cron-wiring-smoke.sh
          php tests/run.php
          php tests/storage-boundary.php
          php -d open_basedir="${GITHUB_WORKSPACE}:/tmp" tests/open-basedir.php
          php tests/smoke-load.php
          php tests/ffmpeg-security.php
          ARGENT_VIDEO_EXPECT_SECURITY=allow php tests/ffmpeg-security-binary.php
          php tests/ffmpeg-integration.php
          bash tests/vendor-fetch.sh
          node --check assets/js/argent-video-player.js
          node --check assets/js/local-retention-admin.js
          node --check blocks/video/index.js

      - name: Check whitespace errors
        run: git diff --check

      - name: Build installable plugin ZIP
        run: bash build/build-plugin.sh '${{ steps.version.outputs.version }}'

      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/argentwolf-video-processor-${{ steps.version.outputs.version }}.zip"
          MANIFEST="$(mktemp)"
          trap 'rm -f -- "${MANIFEST}"' EXIT
          unzip -Z1 "${ZIP}" > "${MANIFEST}"
          test "$(awk -F/ 'NF {print $1}' "${MANIFEST}" | sort -u)" = 'argentwolf-video-processor'
          grep -qx 'argentwolf-video-processor/argentwolf-video-processor.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Uninstall_Data.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/assets/vendor/hls.min.js' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/assets/vendor/hls.LICENSE' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/blocks/video/block.json' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/blocks/video/index.js' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/blocks/video/index.asset.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/blocks/video/style.css' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Backend_Health_Incident_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Backend_Maintenance_Status_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Backend_Processing_Estimator.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Backend_Serving_Priority_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Local_Delivery_Evidence.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Local_Retention_Default_Policy_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Overview_Disposition_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/PeerTube_Daily_Maintenance_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/PeerTube_Publication_Health_Probe.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/PeerTube_Publication_Finalizer_Recovery.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Health_Notification_Policy_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Health_Notification_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Health_Notification_State_Store.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Publication_Health_Repository.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Publication_Health_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Health_Operator_Check.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Health_Operator_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Local_Delivery_Rebuild_Request.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Local_Delivery_Rebuild_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Republish_Request.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Remote_Republish_Service.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Serving_Health_Adapter.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Serving_Health_Adapter_Factory.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Serving_Viability.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Video_Reference_Index.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Video_Routing_Admin.php' "${MANIFEST}"
          grep -qx 'argentwolf-video-processor/includes/Publication_History_Admin.php' "${MANIFEST}"
          ! grep -qx 'argentwolf-video-processor/assets/vendor/hls.VERSION' "${MANIFEST}"
          ! grep -qx 'argentwolf-video-processor/assets/vendor/hls.SHA256' "${MANIFEST}"
          ! grep -Eq '/(AGENTS|ARCHITECTURE|TODO|tests|build|ops|\.github)' "${MANIFEST}"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: argentwolf-video-processor-${{ steps.version.outputs.version }}
          path: |
            dist/argentwolf-video-processor-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
          if-no-files-found: error

